upstream mmftp_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Allow large uploads (direct path up to ~50 MiB + multipart overhead;
    # bigger files use the chunked path). Tune as needed.
    client_max_body_size 64m;

    # Static assets are collected to /static (shared volume).
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://mmftp_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
