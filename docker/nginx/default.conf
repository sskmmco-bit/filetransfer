upstream mmftp_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Allow large uploads (direct path up to ~50 MiB + multipart overhead;
    # bigger files use the chunked path in 5 MiB parts). Tune as needed.
    client_max_body_size 64m;

    # Large files re-hash on completion, which can take a while — give the
    # upstream generous timeouts so the request isn't cut to a 502/504 page.
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 60s;

    # Static assets are collected to /static (shared volume).
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://mmftp_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
