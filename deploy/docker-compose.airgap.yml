# MMFileTransfer — air-gapped production stack (self-contained, image-based).
#
# Unlike docker-compose.prod.yml (which is a layered OVERRIDE for dev machines),
# this file is STANDALONE: it references pre-built images loaded from a tarball
# and is driven entirely by an --env-file. It is the file shipped to the
# air-gapped server.
#
#   docker compose --env-file .env.production -f docker-compose.airgap.yml up -d
#
# The single application image `mmftp_app:latest` runs three roles: web
# (gunicorn), worker (celery), and beat (celery beat). No host ports are exposed
# except the nginx reverse proxy, which binds to loopback (127.0.0.1:8080) and is
# fronted by the host's nginx (TLS terminator). See README_DEPLOY.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mmftp}
      POSTGRES_USER: ${POSTGRES_USER:-mmftp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmftp} -d ${POSTGRES_DB:-mmftp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mmftp_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mmftp_net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mmftp_net
    # MinIO is NOT published to the host. The browser reaches it only through
    # the nginx reverse proxy at /<bucket>/ (presigned URLs). To use the MinIO
    # web console for debugging, temporarily uncomment:
    # ports:
    #   - "127.0.0.1:9001:9001"

  # One-shot: ensure the files bucket exists on first boot, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-mmftp-files} &&
      echo 'bucket ready: ${MINIO_BUCKET:-mmftp-files}'
      "
    restart: "no"
    networks:
      - mmftp_net

  web:
    image: mmftp_app:latest
    restart: unless-stopped
    command: gunicorn mmftp.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 600
    env_file: .env.production
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mmftp_net

  worker:
    image: mmftp_app:latest
    restart: unless-stopped
    entrypoint: /app/docker/entrypoint.celery.sh
    command: celery -A mmftp worker -l info
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mmftp_net

  beat:
    image: mmftp_app:latest
    restart: unless-stopped
    entrypoint: /app/docker/entrypoint.celery.sh
    command: celery -A mmftp beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mmftp_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./deploy/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
    ports:
      # Bound to loopback only; the host's nginx terminates TLS and proxies here.
      - "127.0.0.1:8080:80"
    networks:
      mmftp_net:
        # Static IP so TRUSTED_PROXY_IPS in the env file is deterministic
        # (web logs the real client IP from X-Forwarded-For only when the
        # direct peer is a trusted proxy — see apps/core/utils.py).
        ipv4_address: 172.28.0.10

networks:
  mmftp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pg_data:
  redis_data:
  minio_data:
  static_data:
