# MMFileTransfer — PostgreSQL tuning drop-in for a ~4 GB RAM / 2 vCPU host
# (SSD-backed). Installed to the cluster's conf.d, e.g.:
#   /etc/postgresql/<ver>/main/conf.d/10-mmftp-tuning.conf
# then: systemctl restart postgresql
#
# Conservative values: Postgres shares this box with Gunicorn (3 workers) and
# MinIO, so shared_buffers stays at ~12-15% of RAM rather than the usual 25%.
# Tune upward if Postgres ends up on a dedicated host.

# Memory
shared_buffers = 512MB              # cached pages held by Postgres itself
effective_cache_size = 2GB          # planner hint for OS + PG cache (not allocated)
work_mem = 16MB                     # per sort/hash node; safe with max_connections=50
maintenance_work_mem = 256MB        # faster VACUUM / CREATE INDEX

# Connections — app ceiling is workers*threads (~9) + job runs; 50 is ample
# headroom while keeping work_mem * connections bounded.
max_connections = 50

# SSD-oriented planner + IO
random_page_cost = 1.1
effective_io_concurrency = 200

# Write/checkpoint behaviour
checkpoint_completion_target = 0.9
wal_compression = on

# Durability left at the safe default (synchronous_commit = on): file-metadata
# integrity matters more than the marginal write speedup from turning it off.
