# HOST nginx config for MMFileTransfer (no-Docker install).
#   Install to: /etc/nginx/sites-available/mmftp  (symlinked into sites-enabled)
#
# Reference copy of the server block that deploy/install_no_docker.sh writes.
# It terminates client traffic on :80 (and :443 once a cert is available) and
# routes directly to the Gunicorn app (127.0.0.1:8000), serves static assets off
# disk, and proxies the private MinIO bucket path.
#
# Replace /opt/mmftp/app below if your APP path differs. Set server_name to the
# server IP/hostname, or leave `_` to match any host.

server {
    listen 80;
    listen [::]:80;
    server_name _;                       # e.g. 10.20.30.40

    client_max_body_size 64m;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed static assets (CompressedManifestStaticFilesStorage) — serve
    # straight from disk with a long immutable cache, off the Python tier.
    location /static/ {
        alias /opt/mmftp/app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File transfer can be slow on big objects — generous timeouts, and stream
        # large up/downloads without buffering to disk.
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Private MinIO bucket — presigned URLs handed to browsers point here.
    location /mmftp-files/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }
}

