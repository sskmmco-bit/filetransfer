# HOST nginx config for MMFileTransfer (air-gapped server).
#   Install to: /etc/nginx/sites-available/mmftp  (symlinked into sites-enabled)
#
# This terminates client traffic on :80 (and :443 once a cert is available) and
# forwards EVERYTHING to the compose nginx on 127.0.0.1:8080, which in turn
# routes to the Django app, static files, and MinIO. Keeping all routing in the
# compose nginx (which has Docker-network access) keeps this file simple.
#
# Replace SERVER_IP below with the server's IP, or leave `_` to match any host.

server {
    listen 80;
    listen [::]:80;
    server_name _;            # e.g.  10.20.30.40

    # Must be >= the compose nginx value so large uploads aren't cut here first.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File transfer can be slow on big objects — generous timeouts.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 60s;

        # Stream large up/downloads without buffering to disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

