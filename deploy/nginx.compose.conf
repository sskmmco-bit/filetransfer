# Reverse proxy INSIDE the compose stack (nginx container, bound to
# 127.0.0.1:8080 on the host). The host's own nginx terminates TLS and forwards
# here. This config has Docker-network access to the web container.
#
# Three responsibilities:
#   /static/        -> static files collected into the shared volume
#   /_protected/    -> file blobs on the shared volume (X-Accel-Redirect)
#   /               -> gunicorn (Django)

upstream mmftp_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Direct (small-file) uploads POST through Django. Chunked uploads use
    # 5 MiB parts. 64m covers the direct path plus multipart overhead.
    client_max_body_size 64m;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 60s;

    # ---- Static assets (collectstatic output, shared volume) ----
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
    }

    # ---- Protected blob store (X-Accel-Redirect) ----
    # The app authorizes the request then returns an X-Accel-Redirect into this
    # internal location; nginx serves the bytes from the shared blob volume.
    # The alias MUST match FILE_STORAGE_ROOT inside the container.
    location /_protected/ {
        internal;
        alias /files/;
        sendfile on;
        access_log off;
    }

    # ---- Django application ----
    location / {
        proxy_pass http://mmftp_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
