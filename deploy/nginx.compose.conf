# Reverse proxy INSIDE the compose stack (nginx container, bound to
# 127.0.0.1:8080 on the host). The host's own nginx terminates TLS and forwards
# here. This config has Docker-network access to the web and minio containers,
# which the host nginx does not.
#
# Three responsibilities:
#   /static/        -> static files collected into the shared volume
#   /<bucket>/      -> MinIO S3 API (presigned download/preview URLs)
#   /               -> gunicorn (Django)

upstream mmftp_web {
    server web:8000;
}

upstream mmftp_minio {
    server minio:9000;
}

server {
    listen 80;
    server_name _;

    # Direct (small-file) uploads POST through Django. Chunked uploads use
    # 5 MiB parts. 64m covers the direct path plus multipart overhead.
    client_max_body_size 64m;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 60s;

    # ---- Static assets (collectstatic output, shared volume) ----
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
    }

    # ---- MinIO object storage (presigned URLs hit this path) ----
    # The browser fetches files from presigned URLs of the form
    #   http://<server>/mmftp-files/<key>?X-Amz-Signature=...
    # The SigV4 signature binds to the Host header, so we MUST forward Host
    # unchanged and MUST NOT rewrite the URI (path-style addressing keeps the
    # bucket name in the path). The location below MUST match MINIO_BUCKET.
    # If you change MINIO_BUCKET in the env file, change this prefix too.
    location /mmftp-files/ {
        proxy_pass http://mmftp_minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large downloads: stream straight through, no disk buffering.
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Django application ----
    location / {
        proxy_pass http://mmftp_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
