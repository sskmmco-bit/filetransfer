# Production-like override. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Web runs under Gunicorn (no code bind-mount); nginx terminates HTTP and serves static.

services:
  web:
    command: gunicorn mmftp.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 600
    volumes:
      - static_data:/app/staticfiles
    ports: []          # not exposed directly; nginx is the entry point
    environment:
      DJANGO_DEBUG: "False"

  worker:
    volumes: []         # use the image's baked-in code, not a bind mount

  beat:
    volumes: []

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
    ports:
      - "80:80"

volumes:
  static_data:
