# MMFileTransfer — DEVELOPMENT-ONLY dependency stack (Windows/local).
#
# Runs the two external services Django needs in dev: PostgreSQL + MinIO.
# There is NO Redis (the app uses Django's local-memory cache) and NO app
# container — run Django on the host:  python manage.py runserver
#
# Production (Debian) is no-Docker; see deploy/INSTALL_NO_DOCKER.md.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # keep data
#   docker compose -f docker-compose.dev.yml down -v      # wipe data volumes

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mmftp}
      POSTGRES_USER: ${POSTGRES_USER:-mmftp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmftp}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmftp} -d ${POSTGRES_DB:-mmftp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Host 55432 → container 5432. Uses a high, uncommon port to avoid clashing
      # with native Windows/host PostgreSQL clusters that may already hold
      # 5432/5433. Set POSTGRES_PORT=55432 in .env to match.
      - "55432:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console

  # One-shot: create the files bucket on first boot, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-mmftp-files} &&
      echo 'bucket ready: ${MINIO_BUCKET:-mmftp-files}'
      "
    restart: "no"

volumes:
  pg_data:
  minio_data:
